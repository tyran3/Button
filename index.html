<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Button</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --text: #18181b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --shadow: rgba(37, 99, 235, 0.25);
      --border: #e4e4e7;
      --muted: #52525b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      display: grid;
      place-items: center;
      gap: 1rem;
      text-align: center;
      padding: 2rem;
    }

    .counter {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    #action-button {
      width: min(58vw, 220px);
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(180deg, #3b82f6 0%, var(--primary) 100%);
      color: white;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 28px var(--shadow);
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
      user-select: none;
    }

    #action-button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.4);
      filter: brightness(1.02);
    }

    #action-button:active {
      transform: translateY(0) scale(0.98);
    }

    #action-button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 4px;
    }

    .f-mark {
      font-size: clamp(3rem, 7vw, 4.5rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.08em;
      transform: translateY(-2px);
    }

    .status {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
    }

    .fact-popup {
      position: fixed;
      z-index: 10;
      width: min(260px, calc(100vw - 24px));
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
      overflow: hidden;
      animation: pop-in 180ms ease-out;
      user-select: none;
    }

    .fact-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.6rem 0.5rem 0.8rem;
      background: #e5e7eb;
      cursor: grab;
    }

    .fact-header:active {
      cursor: grabbing;
    }

    .fact-tag {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #374151;
    }

    .fact-close {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      font-size: 1.2rem;
      line-height: 1;
      color: #111827;
    }

    .fact-close:hover {
      background: #dc2626;
      color: white;
    }

    .fact-body {
      padding: 0.8rem 0.9rem 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #1f2937;
    }

    .fact-body p {
      margin: 0;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <p class="counter" id="click-count" aria-live="polite">Clicks: 0</p>
    <button id="action-button" type="button" aria-label="Click the button">
      <span class="f-mark" aria-hidden="true">F</span>
    </button>
    <p class="status" id="status-text" aria-live="polite">Ready.</p>
  </main>

  <script>
    const clickCountEl = document.getElementById('click-count');
    const statusTextEl = document.getElementById('status-text');
    const button = document.getElementById('action-button');

    let clickCount = 0;

    const facts = [
      "Octopuses have three hearts, and two stop beating while they swim.",
      "A group of flamingos is called a flamboyance.",
      "Bananas are berries, but strawberries are not.",
      "The Moon moves away from Earth by about 3.8 centimeters each year.",
      "Wombat poop is cube-shaped.",
      "A day on Venus is longer than its year.",
      "Honey can remain edible for thousands of years when sealed well.",
      "Sea otters sometimes hold hands while they sleep so they do not drift apart.",
      "The Eiffel Tower can grow taller in hot weather as its metal expands.",
      "Some turtles can breathe through specialized tissues in their rear ends.",
      "The dot over a lowercase i or j is called a tittle.",
      "A group of crows is sometimes called a murder.",
      "Sharks existed before trees.",
      "Saturn would float in water if a large enough ocean existed.",
      "Koala fingerprints look remarkably similar to human fingerprints.",
      "The shortest war on record lasted less than an hour.",
      "A newborn kangaroo is about the size of a lima bean.",
      "The human nose can detect many different odors.",
      "An ostrich eye is larger than its brain.",
      "Butterflies taste with sensors on their feet.",
      "Some cats chirp when watching birds.",
      "The word alphabet comes from the Greek letters alpha and beta.",
      "A cloud can weigh hundreds of tonnes.",
      "Cows have best friends and can become stressed when separated.",
      "The largest living structure is the Great Barrier Reef.",
      "A blue whale has a heart roughly the size of a small car.",
      "A shrimp’s heart is located in its head region.",
      "The fingerprints of a koala are hard to distinguish from ours.",
      "The smell after rain is often called petrichor.",
      "A bolt of lightning is hotter than the surface of the Sun.",
      "There are more possible chess games than atoms in the observable universe.",
      "Some bamboo species can grow nearly a meter in a day.",
      "A jiffy is an informal name for a very short time interval.",
      "The first oranges were not orange; they were green.",
      "The heart of a hummingbird can beat very rapidly during flight.",
      "A snail can have thousands of tiny teeth.",
      "The world’s largest desert is Antarctica.",
      "A group of owls is sometimes called a parliament.",
      "Sea stars can regenerate some lost arms.",
      "A giraffe’s tongue can be around 45 centimeters long.",
      "The word muscle comes from a Latin word meaning little mouse.",
      "A day on Jupiter lasts about ten hours.",
      "Some frogs can freeze during winter and thaw in spring.",
      "The Pacific Ocean is larger than all Earth’s land areas combined.",
      "An adult human has 206 bones, though babies have more.",
      "A prism can separate white light into a rainbow of colors.",
      "The first computer mouse was made of wood.",
      "The hashtag symbol is also called an octothorpe.",
      "A group of porcupines is called a prickle.",
      "The world’s smallest mammal by mass is the bumblebee bat.",
      "Penguins have knees hidden beneath their feathers.",
      "The Amazon rainforest spans several South American countries.",
      "Some mushrooms glow in the dark.",
      "The fingerprints of each person are unique.",
      "A crocodile cannot stick out its tongue.",
      "The word queue is pronounced like the letter Q.",
      "A lightning bolt can travel many kilometers.",
      "The color orange was named after the fruit in English.",
      "The Earth is not a perfect sphere; it bulges slightly at the equator.",
      "A group of jellyfish may be called a bloom.",
      "The chemical symbol for gold is Au.",
      "The chemical symbol for silver is Ag.",
      "The capital of Iceland is Reykjavík.",
      "The Earth’s atmosphere is mostly nitrogen.",
      "A narwhal’s tusk is an elongated tooth.",
      "The largest species of penguin is the emperor penguin.",
      "Venus rotates in the opposite direction to most planets.",
      "The Moon has moonquakes.",
      "A baby puffin is called a puffling.",
      "A group of geese on the ground is called a gaggle.",
      "The word robot comes from a Czech word related to forced labor.",
      "The first feature-length animated film was made in Argentina.",
      "Some species of bamboo flower only after many decades.",
      "The human body contains trillions of microbes.",
      "A blue whale’s call can travel long distances underwater.",
      "The Sahara is the largest hot desert on Earth.",
      "A rainbow is actually a full circle, though the ground hides part of it.",
      "A group of parrots is sometimes called a pandemonium.",
      "The world’s oldest known living trees are thousands of years old.",
      "The Pacific Ring of Fire has many active volcanoes.",
      "A chameleon’s tongue can be longer than its body.",
      "An individual piece of spaghetti is called a spaghetto.",
      "The word nerd appeared in a Dr. Seuss book in 1950.",
      "The first email was sent in the early 1970s.",
      "Some dolphins use signature whistles to identify one another.",
      "The Earth takes about 365.24 days to orbit the Sun.",
      "A group of ravens is sometimes called an unkindness.",
      "The world’s largest flower can smell like rotting meat.",
      "The smallest country in the world is Vatican City.",
      "A hummingbird is the only bird that can fly backward.",
      "The Great Wall of China is not visible from the Moon with the unaided eye.",
      "A day on Mars is only a little longer than a day on Earth.",
      "The word avocado comes from a Nahuatl word.",
      "The blue in many bird feathers comes from structure, not blue pigment.",
      "Some sea cucumbers eject internal organs to deter predators.",
      "An emu cannot walk backward easily.",
      "The human brain uses roughly one-fifth of the body’s energy.",
      "The world’s deepest known ocean point is Challenger Deep.",
      "A group of squirrels is called a scurry.",
      "The Sun contains more than 99 percent of the solar system’s mass.",
      "The strongest natural material on Earth is graphene in laboratory studies.",
      "Every year, millions of tons of plastic enter the ocean.",
      "A day on Mercury lasts longer than a year on Mercury.",
      "A fox can hear a mouse moving under snow.",
      "Some ants can carry objects many times their own body weight.",
      "A typical adult human has around 100,000 hairs on their head.",
      "The first human-made object to orbit Earth was Sputnik 1.",
      "A single cloud can contain more water than a lake.",
      "The deepest cave on Earth is deeper than many mountains are tall.",
      "An octopus has a beak hidden inside its mouth.",
      "The average person spends about one-third of their life asleep.",
      "The world’s largest active volcano is Mauna Loa.",
      "A glacier can move several meters in a year.",
      "The tallest waterfall in the world is Angel Falls.",
      "Some frogs can use their lungs and skin to breathe.",
      "A dandelion seed can travel on the wind for long distances.",
      "Pineapples are technically a cluster of berries fused together.",
      "An estimated 80% of the world’s biodiversity is in the ocean.",
      "Sea lions can sleep both half-brains at once.",
      "The human body has more than 600 muscles.",
      "The world’s largest coral reef is the Great Barrier Reef.",
      "A single rainstorm can drop more than a billion droplets.",
      "A hummingbird can flap its wings over 50 times per second.",
      "Chameleons do not change color to match the background exactly.",
      "There are more than 5,000 languages spoken in the world today.",
      "The deepest point in the ocean is about 11 kilometers below sea level.",
      "The largest mammal on Earth is the blue whale.",
      "A single cup of coffee contains hundreds of chemical compounds.",
      "The human body is mostly water by mass.",
      "The tallest mountain from base to peak is Mauna Kea.",
      "Many birds migrate using Earth’s magnetic field.",
      "A single snowflake can have up to 200 crystal branches."
    ];

    const soundPresets = [
      ["sine", [440, 660, 880]],
      ["triangle", [220, 330, 440]],
      ["square", [392, 523, 659]],
      ["sawtooth", [110, 165, 220]],
      ["sine", [494, 740, 988]],
      ["triangle", [294, 440, 587]],
      ["square", [587, 784, 1047]],
      ["sawtooth", [98, 147, 196]],
      ["sine", [523, 659, 784]],
      ["triangle", [247, 370, 494]],
      ["square", [329, 493, 659]],
      ["sawtooth", [146, 220, 294]],
      ["sine", [392, 523, 659]],
      ["triangle", [174, 262, 349]],
      ["square", [440, 880, 1320]],
      ["sawtooth", [82, 123, 164]],
      ["sine", [780, 1040, 1300]],
      ["triangle", [311, 466, 622]],
      ["square", [220, 330, 440]],
      ["sawtooth", [147, 220, 294]]
    ];

    function updateCounter() {
      clickCountEl.textContent = `Clicks: ${clickCount}`;
    }

    function playRandomClickSound() {
      try {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;

        const ac = new AudioCtor();
        const now = ac.currentTime;
        const preset = soundPresets[Math.floor(Math.random() * soundPresets.length)];

        preset[1].forEach((freq, index) => {
          const osc = ac.createOscillator();
          const gain = ac.createGain();

          const start = now + index * 0.08;
          const duration = 0.11 + index * 0.025;

          osc.type = preset[0];
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.12, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

          osc.connect(gain);
          gain.connect(ac.destination);

          osc.start(start);
          osc.stop(start + duration + 0.03);
        });

        setTimeout(() => ac.close(), 800);
      } catch (error) {
        console.warn('Sound unavailable:', error);
      }
    }

    function showRandomFact() {
      const popup = document.createElement('aside');
      popup.className = 'fact-popup';

      const randomFact = facts[Math.floor(Math.random() * facts.length)];

      const header = document.createElement('div');
      header.className = 'fact-header';

      const tag = document.createElement('div');
      tag.className = 'fact-tag';
      tag.textContent = 'fact';

      const closeButton = document.createElement('button');
      closeButton.type = 'button';
      closeButton.className = 'fact-close';
      closeButton.textContent = '×';
      closeButton.setAttribute('aria-label', 'Close fact');

      closeButton.addEventListener('click', () => popup.remove());

      header.append(tag, closeButton);

      const body = document.createElement('div');
      body.className = 'fact-body';

      const text = document.createElement('p');
      text.textContent = randomFact;
      body.appendChild(text);

      popup.append(header, body);

      const maxX = window.innerWidth - popup.offsetWidth - 8;
      const maxY = window.innerHeight - popup.offsetHeight - 8;

      popup.style.left = `${Math.random() * Math.max(8, maxX)}px`;
      popup.style.top = `${Math.random() * Math.max(8, maxY)}px`;

      document.body.appendChild(popup);

      let dragStart = null;
      header.addEventListener('pointerdown', (event) => {
        if (event.target === closeButton) return;
        const rect = popup.getBoundingClientRect();
        dragStart = {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
        header.setPointerCapture(event.pointerId);
      });

      header.addEventListener('pointermove', (event) => {
        if (!dragStart) return;

        const nextLeft = Math.max(8, Math.min(window.innerWidth - popup.offsetWidth - 8, event.clientX - dragStart.x));
        const nextTop = Math.max(8, Math.min(window.innerHeight - popup.offsetHeight - 8, event.clientY - dragStart.y));
        popup.style.left = `${nextLeft}px`;
        popup.style.top = `${nextTop}px`;
      });

      header.addEventListener('pointerup', () => {
        dragStart = null;
      });
      header.addEventListener('pointercancel', () => {
        dragStart = null;
      });
    }

    button.addEventListener('click', () => {
      clickCount += 1;
      updateCounter();
      statusTextEl.textContent = 'Clicked!';
      playRandomClickSound();

      setTimeout(() => {
        statusTextEl.textContent = 'Ready.';
      }, 180);
    });

    updateCounter();

    setInterval(showRandomFact, 5000);
  </script>
</body>
</html>
