<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click Counter</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f4f5;
      color: #18181b;
      font-family: system-ui, sans-serif;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 1rem;
      transform: translateY(-1.5rem);
    }

    #count {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    button {
      width: min(60vw, 240px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: transform 150ms ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 6px;
    }

    button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main>
    <p id="count" aria-live="polite">Clicks: 0</p>
    <button type="button" id="action-button" aria-label="Click the F emblem">
      <img src="f-button.svg" alt="Golden F compass emblem">
    </button>
  </main>
  <script>
    let clicks = 0;
    const count = document.querySelector('#count');

    document.querySelector('#action-button').addEventListener('click', () => {
      clicks += 1;
      count.textContent = `Clicks: ${clicks}`;
    });
  </script>
</body>
</html>
