<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pirate Shop Token Clicker</title>
  <style>
    :root {
      --bg-top: #0f172a;
      --bg-bottom: #111827;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(148, 163, 184, 0.28);
      --text: #e5eefb;
      --muted: #aebcd3;
      --accent: #fbbf24;
      --accent-strong: #f59e0b;
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.3);
      --green: #34d399;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      overflow: hidden;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
    }

    body.shutdown::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      background: rgba(220, 38, 38, 0);
      animation: shutdown-flash 2s infinite;
    }

    @keyframes shutdown-flash {
      0%, 12% {
        background: rgba(220, 38, 38, 0.52);
      }
      13%, 100% {
        background: rgba(220, 38, 38, 0);
      }
    }

    .app {
      position: relative;
      width: min(100%, 1100px);
      height: min(100vh, 820px);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .token-shell {
      position: relative;
      width: min(520px, 90vw);
      text-align: center;
      display: grid;
      gap: 1rem;
      justify-items: center;
      z-index: 1;
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 6px 22px rgba(251, 191, 36, 0.35);
      color: #fff0ba;
    }

    .counter-box {
      width: min(500px, 90vw);
      padding: 1.2rem 1.4rem 1.5rem;
      border-radius: 26px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .counter-label {
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .counter-value {
      font-size: clamp(2.1rem, 5vw, 4rem);
      font-weight: 800;
      margin: 0.3rem 0 1rem;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.45);
    }

    .main-button {
      appearance: none;
      border: none;
      padding: 1.2rem 2.2rem;
      border-radius: 999px;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #1f2937;
      background: linear-gradient(180deg, #fef3c7, #fbbf24);
      box-shadow: 0 16px 28px rgba(251, 191, 36, 0.45);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .main-button:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 20px 32px rgba(251, 191, 36, 0.5);
    }

    .main-button:active {
      transform: translateY(0) scale(0.99);
    }

    .status {
      margin-top: 0.8rem;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .floating-panel {
      position: fixed;
      z-index: 12;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      color: var(--text);
    }

    .time-button {
      top: 18px;
      right: 18px;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-weight: 700;
      padding: 0.65rem 0.9rem;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .time-button:hover {
      transform: translateY(-1px);
      border-color: rgba(251, 191, 36, 0.7);
    }

    .time-icon {
      width: 1.6rem;
      height: 1.6rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(251, 191, 36, 0.12);
      color: var(--accent);
      font-size: 1.05rem;
    }

    .time-popover {
      position: fixed;
      top: 72px;
      right: 18px;
      width: min(360px, calc(100vw - 28px));
      padding: 0.9rem 1rem;
      display: none;
      z-index: 13;
    }

    .time-popover.visible {
      display: block;
    }

    .time-popover p {
      margin: 0;
      line-height: 1.6;
      font-size: 0.97rem;
      color: var(--text);
    }

    .reset-overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(15, 23, 42, 0.46);
      backdrop-filter: blur(4px);
      z-index: 40;
    }

    .reset-overlay.visible {
      display: grid;
    }

    .reset-panel {
      position: relative;
      width: min(540px, 90vw);
      padding: 1.2rem 1.25rem 1rem;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .reset-title {
      margin: 0 0 0.75rem;
      text-align: center;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      color: #fff;
    }

    .blurred-copy {
      filter: blur(4px);
      opacity: 0.88;
      user-select: none;
      text-align: center;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    .confirm-row {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .confirm-button {
      border: none;
      border-radius: 12px;
      padding: 0.72rem 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .confirm-button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .confirm-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .confirm-button.yes {
      background: linear-gradient(180deg, #a7f3d0, #34d399);
      color: #064e3b;
    }

    .confirm-button.no {
      background: linear-gradient(180deg, #fca5a5, #f87171);
      color: #3f0a0a;
    }

    .second-confirm-bubble {
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: min(620px, 90vw);
      padding: 1.4rem 1.2rem;
      border-radius: 30px;
      background: rgba(17, 24, 39, 0.98);
      border: 2px solid rgba(251, 191, 36, 0.7);
      box-shadow: 0 28px 60px rgba(0,0,0,0.5);
      text-align: center;
      z-index: 45;
      display: none;
    }

    .second-confirm-bubble.visible {
      display: block;
    }

    .second-confirm-bubble h3 {
      margin: 0 0 1rem;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      line-height: 1.3;
      color: #fff3c4;
    }

    .second-confirm-bubble .confirm-row {
      margin-top: 0.8rem;
    }

    .second-confirm-bubble .confirm-button {
      font-size: 1.02rem;
      padding: 0.88rem 1.2rem;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    .confetti-piece {
      position: absolute;
      top: -10vh;
      width: 10px;
      height: 18px;
      opacity: 0.9;
      border-radius: 2px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translate3d(var(--drift, 80px), 110vh, 0) rotate(var(--spin, 360deg));
        opacity: 0;
      }
    }

    @media (max-width: 620px) {
      .token-shell {
        padding-top: 2.5rem;
      }

      .counter-box {
        padding: 1rem 1rem 1.2rem;
      }

      .confirm-row {
        flex-direction: column;
      }

      .confirm-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="token-shell">
      <h1 class="title">Pirate Shop Token Clicker</h1>
      <div class="counter-box">
        <div class="counter-label">Pirate Shop Tokens</div>
        <div class="counter-value" id="tokenCount">0</div>
        <button type="button" class="main-button" id="clickButton">Collect Token</button>
        <div class="status" id="statusText">Click to build your treasure chest.</div>
      </div>
    </div>
  </div>

  <button type="button" class="floating-panel time-button" id="timeButton" aria-label="Show time played">
    <span class="time-icon">🕒</span>
    <span id="timeButtonLabel">Time</span>
  </button>

  <div class="floating-panel time-popover" id="timePopover" aria-live="polite">
    <p id="timeText">Time Played: 0 days, 0 hours, 0 minutes, 0 seconds.</p>
  </div>

  <div class="reset-overlay" id="resetOverlay" aria-modal="true" role="dialog">
    <div class="reset-panel" id="resetPanel"></div>
  </div>

  <div class="second-confirm-bubble" id="secondConfirmBubble"></div>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <script>
    const STORAGE_KEY = 'pirateShopTokenClickerState';
    const TIME_KEY = 'pirateShopTokenClickerTime';

    const defaultState = {
      totalClicks: 0,
      pirateTokens: 0,
      progress: {
        upgrades: 0,
        flags: 0,
        markers: 0
      }
    };

    let state = loadState();
    let timePlayedSeconds = Number(localStorage.getItem(TIME_KEY) || '0');
    let lastTick = Date.now();
    let shutdownMode = false;
    let shutdownTimer = null;
    let shutdownAudioContext = null;
    let resetTimer = null;
    let secondResetTimer = null;

    const tokenCountEl = document.getElementById('tokenCount');
    const clickButtonEl = document.getElementById('clickButton');
    const statusTextEl = document.getElementById('statusText');
    const timeTextEl = document.getElementById('timeText');
    const timeButtonEl = document.getElementById('timeButton');
    const timePopoverEl = document.getElementById('timePopover');
    const resetOverlayEl = document.getElementById('resetOverlay');
    const resetPanelEl = document.getElementById('resetPanel');
    const secondConfirmBubbleEl = document.getElementById('secondConfirmBubble');
    const confettiLayerEl = document.getElementById('confettiLayer');

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return { ...defaultState, ...saved, progress: { ...defaultState.progress, ...(saved.progress || {}) } };
      } catch (error) {
        return { ...defaultState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      localStorage.setItem(TIME_KEY, String(Math.floor(timePlayedSeconds)));
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString();
    }

    function formatTimePlayed(totalSeconds) {
      const safeSeconds = Math.max(0, Math.floor(totalSeconds));
      const days = Math.floor(safeSeconds / 86400);
      const hours = Math.floor((safeSeconds % 86400) / 3600);
      const minutes = Math.floor((safeSeconds % 3600) / 60);
      const seconds = safeSeconds % 60;
      return `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
    }

    function updateDisplays() {
      tokenCountEl.textContent = formatNumber(state.pirateTokens);
      timeTextEl.textContent = `Time Played: ${formatTimePlayed(timePlayedSeconds)}.`;
      document.getElementById('timeButtonLabel').textContent = 'Time';
      if (state.totalClicks > 1000000) {
        statusTextEl.textContent = 'Shutdown warning active — confetti disabled.';
      } else {
        statusTextEl.textContent = `Clicks: ${formatNumber(state.totalClicks)} • Treasure boosted.`;
      }
      updateConfettiState();
    }

    function updateConfettiState() {
      const shouldHide = shutdownMode || state.totalClicks > 1000000;
      confettiLayerEl.style.display = shouldHide ? 'none' : 'block';
    }

    function createConfettiBurst() {
      if (shutdownMode || state.totalClicks > 1000000) return;

      const colors = ['#fbbf24', '#fef3c7', '#34d399', '#60a5fa', '#f87171', '#c084fc'];
      for (let i = 0; i < 26; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.setProperty('--drift', `${(Math.random() - 0.5) * 220}px`);
        piece.style.setProperty('--spin', `${(Math.random() * 720 - 360).toFixed(0)}deg`);
        piece.style.animationDuration = `${1.8 + Math.random() * 1.4}s`;
        confettiLayerEl.appendChild(piece);
        setTimeout(() => piece.remove(), 3200);
      }
    }

    function triggerClick() {
      state.totalClicks += 1;
      state.pirateTokens += 1;
      createConfettiBurst();
      updateDisplays();
      saveState();
    }

    function toggleTimePanel() {
      timePopoverEl.classList.toggle('visible');
    }

    function closeDialogs() {
      resetOverlayEl.classList.remove('visible');
      secondConfirmBubbleEl.classList.remove('visible');
      if (resetTimer) {
        clearInterval(resetTimer);
        resetTimer = null;
      }
      if (secondResetTimer) {
        clearInterval(secondResetTimer);
        secondResetTimer = null;
      }
    }

    function buildFirstResetPrompt() {
      resetOverlayEl.classList.add('visible');
      resetPanelEl.innerHTML = `
        <h2 class="reset-title">Reset Progress?</h2>
        <div class="blurred-copy">
          This will wipe your stats, upgrades, and ship logs. Your time played and ancient loot will stay safe.<br>
          Pirate Shop tokens and all progress will be cleared after confirmation.
        </div>
        <div class="confirm-row">
          <button type="button" class="confirm-button yes" id="firstYesBtn">Yes (10)</button>
          <button type="button" class="confirm-button no" id="firstNoBtn">No</button>
        </div>
      `;

      const firstYesBtn = document.getElementById('firstYesBtn');
      const firstNoBtn = document.getElementById('firstNoBtn');
      let countdown = 10;
      firstYesBtn.disabled = true;
      firstYesBtn.textContent = `Yes (${countdown})`;

      resetTimer = setInterval(() => {
        countdown -= 1;
        if (countdown <= 0) {
          clearInterval(resetTimer);
          resetTimer = null;
          firstYesBtn.disabled = false;
          firstYesBtn.textContent = 'Yes';
          return;
        }
        firstYesBtn.textContent = `Yes (${countdown})`;
      }, 1000);

      firstYesBtn.addEventListener('click', () => {
        closeDialogs();
        buildSecondResetPrompt();
      });

      firstNoBtn.addEventListener('click', () => {
        closeDialogs();
      });
    }

    function buildSecondResetPrompt() {
      secondConfirmBubbleEl.classList.add('visible');
      secondConfirmBubbleEl.innerHTML = `
        <h3>Reset ALL Progress?<br>Pirate Shop Tokens Will Be Deleted.</h3>
        <div class="confirm-row">
          <button type="button" class="confirm-button yes" id="secondYesBtn">Yes (Reset All Progress) (10)</button>
          <button type="button" class="confirm-button no" id="secondNoBtn">No (Delete Everything Except Time Played & Pirate Shop Tokens)</button>
        </div>
      `;

      const secondYesBtn = document.getElementById('secondYesBtn');
      const secondNoBtn = document.getElementById('secondNoBtn');
      let secondsLeft = 10;
      secondYesBtn.disabled = true;
      secondYesBtn.textContent = `Yes (Reset All Progress) (${secondsLeft})`;

      secondResetTimer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(secondResetTimer);
          secondResetTimer = null;
          secondYesBtn.disabled = false;
          secondYesBtn.textContent = 'Yes (Reset All Progress)';
          return;
        }
        secondYesBtn.textContent = `Yes (Reset All Progress) (${secondsLeft})`;
      }, 1000);

      secondYesBtn.addEventListener('click', () => {
        fullResetProgress();
      });

      secondNoBtn.addEventListener('click', () => {
        deleteEverythingExceptTimeAndPirateShopTokens();
      });
    }

    function fullResetProgress() {
      state = { ...defaultState, progress: { ...defaultState.progress } };
      saveState();
      closeDialogs();
      updateDisplays();
      statusTextEl.textContent = 'Progress fully reset. Time played is preserved separately.';
    }

    function deleteEverythingExceptTimeAndPirateShopTokens() {
      const keptPirateTokens = state.pirateTokens;
      const keptTime = timePlayedSeconds;

      state = {
        ...defaultState,
        pirateTokens: keptPirateTokens,
        progress: { ...defaultState.progress }
      };

      timePlayedSeconds = keptTime;
      saveState();
      closeDialogs();
      updateDisplays();
      statusTextEl.textContent = 'Everything except time played and pirate shop tokens was cleared.';
    }

    function playShutdownWarning() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        shutdownAudioContext = shutdownAudioContext || new AudioContext();
        shutdownAudioContext.resume().catch(() => {});

        const start = shutdownAudioContext.currentTime;
        [880, 660, 820].forEach((frequency, index) => {
          const osc = shutdownAudioContext.createOscillator();
          const gain = shutdownAudioContext.createGain();
          const begin = start + index * 0.24;

          osc.type = 'square';
          osc.frequency.setValueAtTime(frequency, begin);

          gain.gain.setValueAtTime(0.0001, begin);
          gain.gain.exponentialRampToValueAtTime(0.25, begin + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, begin + 0.22);

          osc.connect(gain);
          gain.connect(shutdownAudioContext.destination);
          osc.start(begin);
          osc.stop(begin + 0.25);
        });
      } catch (error) {
        // Ignore browser audio restrictions.
      }
    }

    function startShutdownMode() {
      shutdownMode = true;
      updateConfettiState();
      document.body.classList.add('shutdown');
      playShutdownWarning();
      shutdownTimer = setInterval(() => {
        playShutdownWarning();
      }, 2000);
    }

    function stopShutdownMode() {
      shutdownMode = false;
      document.body.classList.remove('shutdown');
      if (shutdownTimer) {
        clearInterval(shutdownTimer);
        shutdownTimer = null;
      }
      updateConfettiState();
    }

    function onPageTick() {
      const now = Date.now();
      const deltaSeconds = (now - lastTick) / 1000;
      lastTick = now;
      timePlayedSeconds += deltaSeconds;
      updateDisplays();
      saveState();
    }

    clickButtonEl.addEventListener('click', triggerClick);
    timeButtonEl.addEventListener('click', toggleTimePanel);

    const shouldShutdown = state.totalClicks >= 1000000;
    if (shouldShutdown) {
      startShutdownMode();
    }

    setInterval(onPageTick, 1000);
    document.getElementById('resetButton')?.remove();

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeDialogs();
      }
    });

    document.body.addEventListener('dblclick', () => {
      startShutdownMode();
    });

    window.addEventListener('click', (event) => {
      if (!timePopoverEl.contains(event.target) && !timeButtonEl.contains(event.target)) {
        timePopoverEl.classList.remove('visible');
      }
    });

    const resetButton = document.createElement('button');
    resetButton.type = 'button';
    resetButton.id = 'resetButton';
    resetButton.textContent = 'Reset Progress';
    resetButton.style.position = 'fixed';
    resetButton.style.right = '18px';
    resetButton.style.bottom = '18px';
    resetButton.style.zIndex = '20';
    resetButton.style.padding = '0.72rem 1rem';
    resetButton.style.borderRadius = '12px';
    resetButton.style.border = 'none';
    resetButton.style.cursor = 'pointer';
    resetButton.style.background = 'linear-gradient(180deg, #fca5a5, #ef4444)';
    resetButton.style.color = '#fff';
    resetButton.style.fontWeight = '800';
    resetButton.style.boxShadow = '0 10px 22px rgba(239, 68, 68, 0.38)';
    resetButton.addEventListener('click', buildFirstResetPrompt);
    document.body.appendChild(resetButton);

    updateDisplays();
    setInterval(() => {
      if (state.totalClicks > 1000000) {
        startShutdownMode();
      }
    }, 2500);
  </script>
</body>
</html>
