<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Pirate Shop Token Clicker…</title>
  <style>body{font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0;color:#18181b;background:#f4f4f5}p{padding:1rem}</style>
</head>
<body>
  <p id="status">Loading the game…</p>
  <script>
    fetch(new URL('Main%20Content', window.location.href), { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`Could not load game file (${response.status}).`);
        return response.text();
      })
      .then((html) => {
        document.open();
        document.write(html);
        document.close();
        for (const file of ['panel-lock.js', 'token-fix.js', 'credit-banner.js']) {
          const script = document.createElement('script');
          script.src = new URL(file, window.location.href).href;
          script.onerror = () => console.error(`Could not load ${file}.`);
          document.body.appendChild(script);
        }
      })
      .catch((error) => {
        document.querySelector('#status').textContent =
          `The game could not be loaded. Please check the Main Content file. ${error.message}`;
        console.error(error);
      });
  </script>
</body>
</html>
