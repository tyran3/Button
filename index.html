<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Pirate Shop Token Clicker…</title>
  <style>
    body{font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0;color:#18181b;background:#f4f4f5}
    p{padding:1rem}
    .shutdown-message-layer,.reconstruct-message-layer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
    .shutdown-message-layer{z-index:210;background:transparent;color:#fff;text-shadow:0 4px 18px #600;font-size:clamp(4rem,18vw,12rem);font-weight:1000;letter-spacing:.08em}
    .shutdown-message-layer span{animation:shutdown-text-pulse .8s steps(2,end) infinite}
    .reconstruct-message-layer{z-index:220;background:rgba(22,163,74,.25);color:#fff;text-shadow:0 4px 18px #064e3b;font-size:clamp(2.4rem,10vw,7rem);font-weight:900;letter-spacing:.04em;animation:reconstruct-jitter .2s steps(2,end) infinite}
    body .collapsible{transition:transform .28s ease,opacity .28s ease,filter .28s ease,scale .28s ease!important}
    body.shutdown-chaos{filter:contrast(1.35) saturate(1.5) hue-rotate(25deg);animation:ui-jitter .17s steps(2,end) infinite}
    body.shutdown-chaos #event-status{transform:translateX(5px) skewX(-5deg);filter:blur(.6px)}
    body.shutdown-chaos .shutdown-message-layer span{animation:shutdown-glitch .12s steps(2,end) infinite}
    body.reconstructing{animation:reconstruct-jitter .2s steps(2,end) infinite}
    @keyframes shutdown-text-pulse{50%{opacity:.42;transform:scale(.94)}}
    @keyframes shutdown-glitch{0%{transform:translate(4px,-2px) skewX(8deg)}50%{transform:translate(-5px,2px) skewX(-8deg);color:#ffb4b4}}
    @keyframes ui-jitter{0%{transform:translate(1px,-1px) rotate(.15deg)}50%{transform:translate(-1px,1px) rotate(-.15deg)}}
    @keyframes green-flash{0%,100%{background:rgba(22,163,74,.18)}50%{background:rgba(34,197,94,.72)}}
    @keyframes reconstruct-jitter{0%{filter:brightness(1.15) hue-rotate(-8deg)}50%{filter:brightness(.92) hue-rotate(8deg)}}
    @media(prefers-reduced-motion:reduce){.shutdown-message-layer span,.reconstruct-message-layer,body.shutdown-chaos,body.reconstructing{animation-duration:.5s}}
  </style>
</head>
<body>
  <p id="status">Loading the game…</p>
  <script>
    fetch(new URL('Main%20Content', window.location.href), { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`Could not load game file (${response.status}).`);
        return response.text();
      })
      .then((html) => {
        document.open();
        document.write(html);
        document.close();
        const uiStyles = document.createElement('link');
        uiStyles.rel = 'stylesheet';
        uiStyles.href = new URL('ui-restore.css', window.location.href).href;
        document.head.appendChild(uiStyles);
        const uiFixes = document.createElement('link');
        uiFixes.rel = 'stylesheet';
        uiFixes.href = new URL('ui-fixes.css', window.location.href).href;
        document.head.appendChild(uiFixes);
        document.addEventListener('click', (event) => {
          const clockButton = event.target.closest('#clock-toggle');
          if (!clockButton) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          const panel = document.querySelector('#time-panel');
          if (!panel) return;
          const expanded = panel.classList.toggle('open');
          clockButton.setAttribute('aria-expanded', String(expanded));
          panel.setAttribute('aria-hidden', String(!expanded));
        }, true);
        const effects = document.createElement('script');
        effects.src = new URL('shutdown-effects.js', window.location.href).href;
        effects.onerror = () => console.error('Could not load shutdown effects.');
        document.body.appendChild(effects);
      })
      .catch((error) => {
        document.querySelector('#status').textContent =
          `The game could not be loaded. Please check the Main Content file. ${error.message}`;
        console.error(error);
      });
  </script>
</body>
</html>
