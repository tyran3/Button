<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="f-button.svg">
  <title>Click Counter</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; background:#f4f4f5; color:#18181b; font-family:system-ui,sans-serif; }
    button { font:inherit; cursor:pointer; }
    #reset-progress { position:fixed; z-index:3; top:14px; left:14px; padding:10px 14px; border:2px solid #991b1b; border-radius:8px; background:#dc2626; color:#fff; font-size:.8rem; font-weight:800; letter-spacing:.03em; }
    #reset-progress:hover { background:#b91c1c; }
    main { display:grid; justify-items:center; gap:12px; transition:transform 1s ease,opacity 1s ease,filter 1s ease; }
    #count { margin:0; font-size:1.35rem; font-weight:700; }
    #action-button { width:min(60vw,240px); aspect-ratio:1; padding:0; border:0; border-radius:50%; background:transparent; transition:transform 150ms ease; }
    #action-button:hover { transform:scale(1.05); }
    #action-button:active { transform:scale(.97); }
    #action-button img { display:block; width:100%; height:100%; object-fit:contain; }
    #timer-label { max-width:min(90vw,360px); margin:0; text-align:center; font-size:.95rem; font-weight:650; }

    .drawer { position:fixed; z-index:4; width:min(360px,calc(100vw - 48px)); padding:20px; border:1px solid #e4e4e7; background:#fff; box-shadow:0 12px 35px rgb(24 24 27 / 18%); transition:transform 350ms cubic-bezier(.2,.8,.2,1); }
    #rebirth-drawer { top:50%; left:0; border-left:0; border-radius:0 16px 16px 0; transform:translate(-100%,-50%); }
    #rebirth-drawer.open { transform:translate(0,-50%); }
    .edge-toggle { position:absolute; display:grid; place-items:center; width:44px; height:52px; border:1px solid #e4e4e7; background:#fff; font-size:1.5rem; }
    #rebirth-toggle { top:20px; right:-44px; border-left:0; border-radius:0 12px 12px 0; box-shadow:6px 6px 18px rgb(24 24 27 / 10%); }
    .rebirth-list { display:grid; gap:10px; }
    .bubble { padding:12px 14px; border:1px solid #e4e4e7; border-radius:14px; background:#f8fafc; font-weight:650; }
    .bubble p { margin:0; }
    .bubble small { display:block; margin-top:4px; color:#52525b; font-size:.85rem; font-weight:500; }
    .auto-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .toggle-button { min-width:90px; padding:11px 14px; border:0; border-radius:10px; background:#dc2626; color:white; font-weight:750; }
    .toggle-button[aria-pressed="true"] { background:#16a34a; }

    #access-drawer { right:0; bottom:0; padding:18px; border-right:0; border-bottom:0; border-radius:16px 0 0 0; transform:translate(100%,100%); }
    #access-drawer.open { transform:translate(0,0); }
    #access-toggle { top:-50px; left:-50px; width:50px; height:50px; border-bottom:0; border-right:0; border-radius:14px 0 0 0; box-shadow:-6px -6px 18px rgb(24 24 27 / 10%); }
    .rainbow { display:inline-block; animation:rainbow 2s linear infinite; }
    @keyframes rainbow { 0%{color:#ef4444} 17%{color:#f97316} 33%{color:#eab308} 50%{color:#22c55e} 67%{color:#3b82f6} 83%{color:#a855f7} 100%{color:#ef4444} }
    .access-content { display:grid; gap:10px; max-height:min(65vh,520px); overflow:auto; }
    .panel-heading { margin:0; font-size:1rem; }
    .password-box { display:grid; gap:10px; }
    #password-display { width:100%; padding:11px; border:1px solid #d4d4d8; border-radius:9px; background:#fafafa; font-size:1.1rem; letter-spacing:.15em; }
    .phone-keys { display:grid; grid-template-columns:repeat(10,minmax(22px,1fr)); gap:4px; }
    .phone-keys button { min-height:36px; padding:4px 2px; border:1px solid #d4d4d8; border-radius:6px; background:#f4f4f5; font-size:.83rem; font-weight:650; }
    .phone-keys button:hover { background:#e4e4e7; }
    .phone-keys .wide { grid-column:span 2; }
    .password-actions { display:flex; gap:8px; }
    .password-actions button,.bonus-button { flex:1; padding:10px; border:0; border-radius:8px; background:#2563eb; color:#fff; font-weight:700; }
    .password-actions .clear-key { background:#71717a; }
    #password-error { min-height:1.2em; margin:0; color:#dc2626; font-size:.85rem; }
    #private-tools { display:none; gap:9px; }
    #private-tools.unlocked { display:grid; }
    .bonus-button { width:100%; }
    .bonus-button:hover,.password-actions button:hover { filter:brightness(.92); }

    .fact-popup { position:fixed; z-index:6; width:min(240px,calc(100vw - 16px)); overflow:hidden; border:1px solid #cbd0d8; border-radius:9px; background:#fff; color:#272a30; box-shadow:0 8px 26px rgb(0 0 0 / 24%); animation:appear 180ms ease-out; }
    .fact-bar { min-height:34px; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:4px 5px 4px 10px; background:#e5e7eb; cursor:grab; touch-action:none; user-select:none; }
    .fact-tab { margin-right:auto; font-size:.75rem; font-weight:650; }
    .fact-close { width:26px; height:26px; border:0; border-radius:5px; background:transparent; font-size:1.1rem; }
    .fact-close:hover { background:#dc2626; color:#fff; }
    .fact-body { min-height:92px; display:grid; align-content:center; padding:14px; font-size:.875rem; line-height:1.45; }
    .fact-body p { margin:0; }
    #celebration-layer { position:fixed; z-index:8; inset:0; overflow:hidden; pointer-events:none; }
    .confetti { position:absolute; top:-18px; width:10px; height:16px; animation:fall 3s linear forwards; }
    @keyframes fall { to { transform:translate3d(var(--drift),110vh,0) rotate(900deg); opacity:.8; } }
    .celebrating main #action-button { animation:party 500ms ease-in-out infinite alternate; }
    @keyframes party { to { filter:drop-shadow(0 0 24px #facc15); transform:scale(1.07) rotate(4deg); } }
    body.shutdown main, body.shutdown #rebirth-drawer, body.shutdown #access-drawer, body.shutdown #reset-progress { transform:scale(.05); opacity:0; filter:blur(8px); pointer-events:none; }
    @keyframes appear { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <button id="reset-progress" type="button">RESET ALL PROGRESS</button>
  <main>
    <p id="count" aria-live="polite">Clicks: 0</p>
    <button id="action-button" type="button" aria-label="Click the F emblem"><img src="f-button.svg" alt="Golden F compass emblem"></button>
    <p id="timer-label" aria-live="polite">10 Seconds | Pirate Shop Token Chance: 1/137,500</p>
  </main>

  <aside class="drawer" id="rebirth-drawer" aria-label="Rebirth settings">
    <button class="edge-toggle" id="rebirth-toggle" type="button" aria-label="Open rebirth panel" aria-expanded="false">›</button>
    <div class="rebirth-list" id="rebirth-content" aria-hidden="true">
      <div class="bubble"><p>Rebirth</p><small id="rebirth-count">Rebirths: 0</small></div>
      <div class="bubble"><p>Pirate Shop Token Chance</p><small id="chance-display">1/137,500</small></div>
      <div class="bubble"><p>Pirate Shop Tokens | PERMANENT: <span id="token-count">0</span></p></div>
      <div class="bubble auto-row"><p>Auto rebirth<br><small>Rebirth every 100 clicks</small></p><button class="toggle-button" id="rebirth-auto" type="button" aria-pressed="false">Auto Off</button></div>
    </div>
  </aside>

  <aside class="drawer" id="access-drawer" aria-label="Tyran's panel only">
    <button class="edge-toggle" id="access-toggle" type="button" aria-label="Open Tyran's panel only" aria-expanded="false"><span class="rainbow" aria-hidden="true">↖</span></button>
    <div class="access-content" id="access-content" aria-hidden="true">
      <h2 class="panel-heading">tyran's panel only</h2>
      <div class="password-box" id="password-box">
        <input id="password-display" type="password" aria-label="Password" placeholder="Enter password" readonly autocomplete="off">
        <div class="phone-keys" id="phone-keys" aria-label="On-screen keyboard"></div>
        <div class="password-actions"><button class="clear-key" id="password-clear" type="button">Clear</button><button id="password-submit" type="button">Enter</button></div>
        <p id="password-error" aria-live="polite"></p>
      </div>
      <div id="private-tools">
        <div class="bubble auto-row"><p>Autoclicker <small>Use only if needed</small></p><button class="toggle-button" id="clicker-toggle" type="button" aria-pressed="false">Off</button></div>
        <button class="bonus-button" type="button" data-add="1000">Add 1,000 Clicks</button>
        <button class="bonus-button" type="button" data-add="10000">Add 10,000 Clicks</button>
        <button class="bonus-button" type="button" data-add="100000">Add 100,000 Clicks</button>
      </div>
    </div>
  </aside>

  <div id="celebration-layer" aria-hidden="true"></div>
  <script>
    const SAVE_KEY = 'click-counter-save';
    const BASE_TOKEN_ODDS = 137500;
    const PASSWORD = 'Button';
    let clicks = 0, rebirths = 0, pirateTokens = 0, autoRebirth = false, autoclicker = false;
    let autoclickerTimer = null, countdown = 10, phase = 'rolling', phaseTimer = null, popupFactIndex = -1;
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (saved && Number.isSafeInteger(saved.clicks) && saved.clicks >= 0) clicks = saved.clicks;
      if (saved && Number.isSafeInteger(saved.rebirths) && saved.rebirths >= 0) rebirths = saved.rebirths;
      if (saved && Number.isSafeInteger(saved.pirateTokens) && saved.pirateTokens >= 0) pirateTokens = saved.pirateTokens;
      if (saved && typeof saved.autoRebirth === 'boolean') autoRebirth = saved.autoRebirth;
      if (saved && typeof saved.autoclicker === 'boolean') autoclicker = saved.autoclicker;
    } catch (error) { console.warn('Could not load saved progress.', error); }

    const $ = (selector) => document.querySelector(selector);
    const chance = () => Math.max(1, BASE_TOKEN_ODDS - rebirths * 1001);
    const safeSave = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ clicks, rebirths, pirateTokens, autoRebirth, autoclicker })); } catch (error) { console.warn('Could not save progress.', error); } };
    function updateUI() {
      $('#count').textContent = `Clicks: ${clicks.toLocaleString()}`;
      $('#rebirth-count').textContent = `Rebirths: ${rebirths.toLocaleString()}`;
      $('#token-count').textContent = pirateTokens.toLocaleString();
      $('#chance-display').textContent = `1/${chance().toLocaleString()}`;
      $('#rebirth-auto').setAttribute('aria-pressed', String(autoRebirth));
      $('#rebirth-auto').textContent = autoRebirth ? 'Auto On' : 'Auto Off';
      $('#clicker-toggle').setAttribute('aria-pressed', String(autoclicker));
      $('#clicker-toggle').textContent = autoclicker ? 'On' : 'Off';
    }
    function playRandomMemeStyleSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;
        const sounds = [
          [[110,0,.18,'sawtooth'],[55,.08,.28,'sawtooth']],
          [[660,0,.09,'square'],[880,.1,.1,'square'],[1320,.21,.18,'triangle']],
          [[440,0,.12,'triangle'],[330,.13,.12,'triangle'],[220,.26,.25,'sine']],
          [[880,0,.07,'sine'],[660,.08,.07,'sine'],[990,.17,.22,'square']]
        ];
        const pattern = sounds[Math.floor(Math.random() * sounds.length)];
        pattern.forEach(([frequency, offset, duration, type]) => {
          const oscillator = ctx.createOscillator(), gain = ctx.createGain();
          oscillator.type = type; oscillator.frequency.setValueAtTime(frequency, now + offset);
          gain.gain.setValueAtTime(.0001, now + offset);
          gain.gain.exponentialRampToValueAtTime(.12, now + offset + .015);
          gain.gain.exponentialRampToValueAtTime(.0001, now + offset + duration);
          oscillator.connect(gain); gain.connect(ctx.destination);
          oscillator.start(now + offset); oscillator.stop(now + offset + duration + .02);
        });
        window.setTimeout(() => ctx.close(), 900);
      } catch (error) { /* Audio is optional; the game still works if browser audio is unavailable. */ }
    }
    function awardClicks(amount) {
      if (phase !== 'rolling') return;
      clicks += amount;
      if (autoRebirth) {
        const earned = Math.floor(clicks / 100);
        if (earned) { clicks %= 100; rebirths += earned; }
      }
      updateUI(); safeSave();
    }
    function openDrawer(drawerId, buttonId, contentId, openedLabel, closedLabel) {
      const drawer = $(drawerId), button = $(buttonId), content = $(contentId);
      const opened = drawer.classList.toggle('open');
      button.setAttribute('aria-expanded', String(opened));
      button.setAttribute('aria-label', opened ? closedLabel : openedLabel);
      content.setAttribute('aria-hidden', String(!opened));
      if (buttonId === '#rebirth-toggle') button.textContent = opened ? '‹' : '›';
    }
    $('#rebirth-toggle').addEventListener('click', () => openDrawer('#rebirth-drawer','#rebirth-toggle','#rebirth-content','Open rebirth panel','Close rebirth panel'));
    $('#access-toggle').addEventListener('click', () => openDrawer('#access-drawer','#access-toggle','#access-content',"Open Tyran's panel only","Close Tyran's panel only"));
    $('#action-button').addEventListener('click', () => { playRandomMemeStyleSound(); awardClicks(1); });
    $('#rebirth-auto').addEventListener('click', () => { autoRebirth = !autoRebirth; if (autoRebirth) awardClicks(0); updateUI(); safeSave(); });
    document.querySelectorAll('.bonus-button').forEach(button => button.addEventListener('click', () => awardClicks(Number(button.dataset.add))));
    function restartAutoclicker() {
      if (autoclickerTimer !== null) clearInterval(autoclickerTimer);
      autoclickerTimer = autoclicker ? setInterval(() => awardClicks(1), 100) : null;
    }
    $('#clicker-toggle').addEventListener('click', () => { autoclicker = !autoclicker; restartAutoclicker(); updateUI(); safeSave(); });

    const keyLayout = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
    keyLayout.forEach(row => {
      const rowKeys = [...row];
      if (row === 'ZXCVBNM') rowKeys.unshift('⌫');
      rowKeys.forEach(character => {
        const key = document.createElement('button'); key.type = 'button'; key.textContent = character;
        if (character === '⌫') key.classList.add('wide');
        key.addEventListener('click', () => {
          const input = $('#password-display');
          input.value = character === '⌫' ? input.value.slice(0,-1) : (input.value.length < 20 ? input.value + character : input.value);
          $('#password-error').textContent = '';
        });
        $('#phone-keys').append(key);
      });
    });
    const space = document.createElement('button'); space.type='button'; space.textContent='Space'; space.className='wide';
    space.addEventListener('click', () => { $('#password-display').value += ' '; }); $('#phone-keys').append(space);
    $('#password-clear').addEventListener('click', () => { $('#password-display').value=''; $('#password-error').textContent=''; });
    $('#password-submit').addEventListener('click', () => {
      if ($('#password-display').value === PASSWORD) {
        $('#password-box').style.display='none'; $('#private-tools').classList.add('unlocked'); $('#password-error').textContent='';
      } else { $('#password-error').textContent='Incorrect password. Try again.'; }
    });

    $('#reset-progress').addEventListener('click', () => {
      if (!window.confirm('Reset clicks and rebirths? Your permanent Pirate Shop Tokens will be kept.')) return;
      clicks = 0; rebirths = 0; autoRebirth = false; autoclicker = false; restartAutoclicker(); updateUI(); safeSave();
    });

    const facts = [
      'Octopuses have three hearts, and two stop beating while they swim.',
      'A group of flamingos is called a flamboyance.',
      'Bananas are berries, but strawberries are not.',
      'The Moon moves away from Earth by about 3.8 centimeters each year.',
      'Wombat poop is cube-shaped.',
      'A day on Venus is longer than its year.',
      'Honey can remain edible for thousands of years when sealed well.',
      'Sea otters sometimes hold hands while they sleep so they do not drift apart.',
      'The Eiffel Tower can grow taller in hot weather as its metal expands.',
      'Some turtles can breathe through specialized tissues in their rear ends.'
    ];
    function showFact() {
      const popup = document.createElement('section'); popup.className='fact-popup'; popup.setAttribute('aria-label',"Tyran's ad: random fun fact");
      const bar = document.createElement('div'); bar.className='fact-bar';
      const tab = document.createElement('span'); tab.className='fact-tab'; tab.textContent="tyran's ad";
      const close = document.createElement('button'); close.type='button'; close.className='fact-close'; close.textContent='×'; close.setAttribute('aria-label','Close popup'); close.addEventListener('click',()=>popup.remove());
      bar.append(tab,close);
      const fact = document.createElement('div'); fact.className='fact-body'; const p=document.createElement('p');
      let index=Math.floor(Math.random()*facts.length); if(index===popupFactIndex) index=(index+1)%facts.length; popupFactIndex=index; p.textContent=facts[index]; fact.append(p); popup.append(bar,fact); document.body.append(popup);
      const margin=8, maxX=Math.max(margin,innerWidth-popup.offsetWidth-margin), maxY=Math.max(margin,innerHeight-popup.offsetHeight-margin);
      popup.style.left=`${margin+Math.random()*(maxX-margin)}px`; popup.style.top=`${margin+Math.random()*(maxY-margin)}px`;
      let drag=null;
      bar.addEventListener('pointerdown',e=>{ if(e.target===close)return; const r=popup.getBoundingClientRect(); drag={x:e.clientX-r.left,y:e.clientY-r.top}; bar.setPointerCapture(e.pointerId); });
      bar.addEventListener('pointermove',e=>{ if(!drag)return; popup.style.left=`${Math.max(0,Math.min(innerWidth-popup.offsetWidth,e.clientX-drag.x))}px`; popup.style.top=`${Math.max(0,Math.min(innerHeight-popup.offsetHeight,e.clientY-drag.y))}px`; });
      bar.addEventListener('pointerup',()=>drag=null); bar.addEventListener('pointercancel',()=>drag=null);
    }
    setInterval(showFact,5000);

    function confettiBurst() {
      document.body.classList.add('celebrating');
      const layer=$('#celebration-layer');
      const colors=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#a855f7','#ec4899'];
      const burst=setInterval(()=>{
        for(let i=0;i<8;i++) { const piece=document.createElement('i'); piece.className='confetti'; piece.style.left=`${Math.random()*100}vw`; piece.style.background=colors[Math.floor(Math.random()*colors.length)]; piece.style.setProperty('--drift',`${(Math.random()-.5)*220}px`); piece.style.animationDuration=`${2+Math.random()*2}s`; layer.append(piece); piece.addEventListener('animationend',()=>piece.remove()); }
      },120);
      phase='celebration'; countdown=10;
      $('#timer-label').textContent=`${countdown} Seconds | Pirate Shop Token found!`;
      phaseTimer=setInterval(()=>{ countdown--; $('#timer-label').textContent=`${countdown} Seconds | Pirate Shop Token celebration`; if(countdown<=0){clearInterval(phaseTimer);clearInterval(burst);layer.replaceChildren();document.body.classList.remove('celebrating');startShutdown();}},1000);
    }
    function startShutdown() {
      phase='shutdown'; countdown=60; document.body.classList.add('shutdown');
      $('#timer-label').textContent=`${countdown} Seconds Until Shutdown`;
      phaseTimer=setInterval(()=>{
        countdown--; $('#timer-label').textContent=`${countdown} Seconds Until Shutdown`;
        if(countdown<=0){clearInterval(phaseTimer);document.body.classList.remove('shutdown');clicks=0;rebirths=0;autoRebirth=false;autoclicker=false;restartAutoclicker();phase='rolling';countdown=10;updateUI();safeSave();$('#timer-label').textContent=`10 Seconds | Pirate Shop Token Chance: 1/${chance().toLocaleString()}`;}
      },1000);
    }
    function rollToken() {
      if(phase!=='rolling')return;
      if(Math.floor(Math.random()*chance())===0){ pirateTokens++; updateUI(); safeSave(); confettiBurst(); }
      else countdown=10;
    }
    updateUI(); restartAutoclicker(); safeSave();
    setInterval(()=>{
      if(phase==='rolling'){
        countdown--;
        if(countdown<=0) rollToken();
        if(phase==='rolling') $('#timer-label').textContent=`${countdown} Seconds | Pirate Shop Token Chance: 1/${chance().toLocaleString()}`;
      }
    },1000);
  </script>
</body>
</html>
